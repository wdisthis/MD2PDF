<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD2PDF | Premium Markdown to PDF Converter</title>
    <meta name="description" content="A beautiful and static Markdown to PDF converter using PyScript. Perfect for creating readable documents.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading PyScript Runtime...</p>
    </div>

    <header>
        <h1>MD2PDF</h1>
        <div class="actions">
            <button class="secondary" onclick="window.exportPDF('normal')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Export (A4)
            </button>
            <button class="secondary" onclick="window.exportPDF('long')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                Export (Long Page)
            </button>
        </div>
    </header>

    <main>
        <section class="editor-container">
            <div class="label">Markdown Editor</div>
            <textarea id="editor" placeholder="Type your markdown here..." oninput="window.convert_markdown()"></textarea>
        </section>
        
        <section class="preview-container">
            <div class="label">Live Preview</div>
            <div id="preview" class="markdown-body"></div>
        </section>
    </main>

    <script type="py" src="main.py" config="pyscript.toml"></script>

    <script>
        // Hide loading overlay once PyScript is ready
        document.addEventListener('py:ready', () => {
            const loader = document.getElementById('loading');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        });

        // Simple debounce/proxy for PyScript access if needed
        window.convert_markdown = () => {
            // This will be overridden by main.py
        };

        window.exportPDF = (type) => {
            if (type === 'long') {
                const preview = document.getElementById('preview');
                const height = preview.scrollHeight;
                
                // Add a temporary style to handle the long page
                const style = document.createElement('style');
                style.id = 'long-page-style';
                
                // We use a fixed width (A4 width approx) and dynamic height
                // 1px is approx 0.264583mm
                // Adding 40mm to account for the 2cm top/bottom padding
                const heightMm = (height * 0.264583) + 40; 
                
                style.innerHTML = `@page { size: 210mm ${heightMm}mm; margin: 0; }`;
                document.head.appendChild(style);
                document.body.classList.add('long-page-print');
                
                window.print();
                
                // Cleanup after dialog closes
                setTimeout(() => {
                    document.head.removeChild(style);
                    document.body.classList.remove('long-page-print');
                }, 1000);
            } else {
                window.print();
            }
        };
    </script>
</body>
</html>
